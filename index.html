<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFW Einsatzplaner Pro | Hybrid-Modus</title>
    <style>
        :root { 
            --fire: #c0392b; --thl: #2980b9; --dark: #2c3e50; --bg: #f4f7f6; 
            --accent: #e67e22; --disabled: #95a5a6; --success: #27ae60; 
        }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); overflow: hidden; }
        
        /* Modus-abhängiges Design */
        body.mode-thl { --current-theme: var(--thl); }
        body.mode-brand { --current-theme: var(--fire); }

        .sidebar { width: 750px; background: var(--dark); color: white; padding: 20px; overflow-y: auto; border-right: 5px solid var(--current-theme); transition: 0.3s; }
        
        .mode-switch { display: flex; gap: 10px; margin-bottom: 20px; background: #34495e; padding: 5px; border-radius: 8px; }
        .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; color: white; background: transparent; }
        .mode-btn.active { background: var(--current-theme); box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        .select-all-btn { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #555; background: #34495e; color: white; cursor: pointer; font-weight: bold; }

        #checkliste { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .member { display: flex; flex-direction: column; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; min-height: 85px; justify-content: space-between; }
        .member.selected { background: rgba(39, 174, 96, 0.3); border-color: var(--success); }
        .member b { font-size: 0.85em; color: white; }
        
        .badge-small { display: inline-block; padding: 1px 5px; border-radius: 3px; margin-right: 4px; margin-bottom: 4px; font-weight: bold; font-size: 0.85em; }
        .b-zf { background: #e74c3c; color: white; }
        .b-gf { background: #e67e22; color: white; }
        .b-ma { background: #f1c40f; color: black; }
        .b-agt { background: #2ecc71; color: white; }
        .b-tf { background: #3498db; color: white; }
        .count-badge { align-self: flex-end; background: var(--current-theme); color: white; padding: 1px 6px; border-radius: 10px; font-size: 0.75em; font-weight: bold; }

        .main { flex: 1; padding: 20px; overflow-y: auto; }
        .status-bar { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .fz-toggle { padding: 8px 12px; border-radius: 4px; cursor: pointer; border: 2px solid var(--current-theme); font-weight: bold; background: white; color: var(--current-theme); }
        .fz-toggle.active { background: var(--current-theme); color: white; }

        .action-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        button#run { background: var(--success); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold; }
        button#saveBtn { background: var(--thl); color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; display: none; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .vehicle { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 6px solid var(--current-theme); }
        .role { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f9f9f9; font-size: 0.9em; }
        .warn { color: var(--accent) !important; font-style: italic; font-weight: bold; }
    </style>
</head>
<body class="mode-brand">

<div class="sidebar">
    <div class="mode-switch">
        <button class="mode-btn active" id="btnBrand" onclick="setMode('brand')">🔥 Brand</button>
        <button class="mode-btn" id="btnTHL" onclick="setMode('thl')">🛠 THL</button>
    </div>
    <h2>👨‍🚒 Mannschaft</h2>
    <button class="select-all-btn" id="btnToggleAll" onclick="toggleAll()">✅ Alle auswählen</button>
    <div id="checkliste">Lade Daten...</div>
</div>

<div class="main">
    <div id="statusBar" class="status-bar"></div>
    <div class="action-btns">
        <button id="run" onclick="verteileMannschaft()">🚀 Personal taktisch verteilen</button>
        <button id="saveBtn" onclick="speichereUebung()">💾 Übungsteilnahme speichern</button>
    </div>
    <div id="anzeige" class="grid"></div>
</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxNldvB7VMGoa9CVQtZ-5qyRzxmE07U1Zd0V0szAyvDkVcuBBMu_SmuwX3ZsKNyo8iNDA/exec";
let mannschaft = [];
let allSelected = false;
let currentMode = 'brand';

const fahrzeuge = [
    { id: 3, name: "MTW (ELW)", minFS: "B", active: true, slots: ["Zugführer", "Maschinist", "GF"] },
    { id: 0, name: "MLF", minFS: "C1", active: true, slots: ["GF", "MA", "ATF", "ATM", "WTF", "WTM"] },
    { id: 1, name: "LF 16/12", minFS: "C", active: true, slots: ["GF", "MA", "ATF", "ATM", "WTF", "WTM", "STF", "STM", "Melder"] },
    { id: 2, name: "GW-T", minFS: "C", active: true, slots: ["Staffelführer", "MA", "Trupp 1", "Trupp 2", "Trupp 3", "Trupp 4"] }
];


function setMode(mode) {
    currentMode = mode;
    document.body.className = `mode-${mode}`;
    document.getElementById('btnBrand').classList.toggle('active', mode === 'brand');
    document.getElementById('btnTHL').classList.toggle('active', mode === 'thl');
    zeichneStatusBar();
}

async function ladeDaten() {
    try {
        const res = await fetch(scriptURL);
        const data = await res.json();
        mannschaft = data.sort((a, b) => a.name.split(" ").slice(-1)[0].localeCompare(b.name.split(" ").slice(-1)[0]));
        zeichneCheckliste();
        zeichneStatusBar();
    } catch (e) { document.getElementById('checkliste').innerHTML = "Fehler!"; }
}

function zeichneStatusBar() {
    const bar = document.getElementById('statusBar');
    bar.innerHTML = "";
    fahrzeuge.forEach(fz => {
        const btn = document.createElement('div');
        btn.className = `fz-toggle ${fz.active ? 'active' : 'inactive'}`;
        btn.innerText = fz.name;
        btn.onclick = () => { fz.active = !fz.active; zeichneStatusBar(); };
        bar.appendChild(btn);
    });
}

function zeichneCheckliste() {
    const list = document.getElementById('checkliste');
    list.innerHTML = "";
    mannschaft.forEach((k, i) => {
        let badges = "";
        if(k.zf) badges += `<span class="badge-small b-zf">ZF</span> `;
        if(k.gf) badges += `<span class="badge-small b-gf">GF</span> `;
        if(k.ma) badges += `<span class="badge-small b-ma">MA</span> `;
        if(k.agt) badges += `<span class="badge-small b-agt">AGT</span> `;
        if(k.tf) badges += `<span class="badge-small b-tf">TF</span> `;

        list.innerHTML += `
            <div class="member" onclick="toggleMember(${i}, this)" id="mem-${i}">
                <div style="pointer-events:none">
                    <div style="display:flex; align-items:flex-start">
                        <input type="checkbox" id="cb-${i}" data-idx="${i}">
                        <b>${k.name}</b>
                    </div>
                    <div style="margin-top:5px">${badges}</div>
                </div>
                <div class="count-badge">${k.count || 0}</div>
            </div>`;
    });
}

function toggleMember(idx, element) {
    const cb = document.getElementById(`cb-${idx}`);
    cb.checked = !cb.checked;
    element.classList.toggle('selected', cb.checked);
}

function toggleAll() {
    allSelected = !allSelected;
    mannschaft.forEach((_, i) => {
        const cb = document.getElementById(`cb-${i}`);
        const div = document.getElementById(`mem-${i}`);
        cb.checked = allSelected;
        div.classList.toggle('selected', allSelected);
    });
}

function verteileMannschaft() {
    let pool = [];
    document.querySelectorAll('#checkliste input:checked').forEach(cb => {
        pool.push({...mannschaft[cb.getAttribute('data-idx')]});
    });
    
    // Sortierung: Bei THL ist AGT fast egal (Gewichtung reduziert)
    pool.sort((a, b) => {
        const score = (p) => (p.zf?100:0)+(p.gf?50:0)+(p.ma?30:0)+(p.tf?10:0)+(currentMode==='brand'&&p.agt?20:0);
        return score(b) - score(a);
    });

    const anzeige = document.getElementById('anzeige');
    anzeige.innerHTML = "";
    let ergebnis = {};
    const aktiveFahrzeuge = fahrzeuge.filter(fz => fz.active);

    const findPerson = (q, p) => { let i = p.findIndex(x => x[q]); return i !== -1 ? p.splice(i, 1)[0].name : null; };
    const findMA = (fs, p) => {
        const h = { "B": ["B", "C1", "C"], "C1": ["C1", "C"], "C": ["C"] };
        let i = p.findIndex(x => x.ma && h[fs].includes(x.fs));
        return i !== -1 ? p.splice(i, 1)[0].name : null;
    };

    aktiveFahrzeuge.forEach(fz => {
        ergebnis[fz.id] = {};
        fz.slots.forEach(rolle => {
            // Führung & Maschinist (immer gleich)
            if (["GF", "Staffelführer", "Zugführer"].includes(rolle)) ergebnis[fz.id][rolle] = findPerson("zf", pool) || findPerson("gf", pool) || findPerson("tf", pool) || "---";
            if (rolle === "MA" || rolle === "Maschinist") ergebnis[fz.id][rolle] = findMA(fz.minFS, pool) || "<span class='warn'>Fahrer fehlt</span>";
            
            // Trupps (Modus-abhängig)
            if (!ergebnis[fz.id][rolle]) {
                if (currentMode === 'brand' && (rolle.includes("AT") || rolle.includes("WT"))) {
                    ergebnis[fz.id][rolle] = findPerson("agt", pool) || "<span class='warn'>Kein AGT</span>";
                } else {
                    // Im THL Modus oder für sonstige Rollen einfach der Nächste im Pool
                    ergebnis[fz.id][rolle] = pool.length > 0 ? pool.splice(0,1)[0].name : "---";
                }
            }
        });
    });

    aktiveFahrzeuge.forEach(fz => {
        let html = `<div class="vehicle"><h2>${fz.name}</h2>`;
        fz.slots.forEach(r => html += `<div class="role"><b>${r}</b> <span>${ergebnis[fz.id][r]}</span></div>`);
        anzeige.innerHTML += html + "</div>";
    });
    document.getElementById('saveBtn').style.display = "block";
}

async function speichereUebung() {
    const selected = [];
    document.querySelectorAll('#checkliste input:checked').forEach(cb => {
        selected.push(mannschaft[cb.getAttribute('data-idx')].name);
    });
    if (!confirm(`${selected.length} Personen speichern?`)) return;
    try {
        await fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ selectedNames: selected }) });
        alert("Gespeichert!"); location.reload();
    } catch (e) { alert("Fehler!"); }
}

ladeDaten();
</script>
</body>
</html>
